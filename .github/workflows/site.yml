# Every 3 hours: refreshes The Wire (data/news.json), the hotfix log (data/hotfixes.json) and source health
# (data/health.json), opens or closes an issue if a source breaks, and deploys the site to GitHub Pages.
# A failed fetch keeps the last good news file, so the site never goes blank.
name: Refresh news and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # the latest main, not the commit that queued this run: an earlier run may have saved news since
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and the hotfix log
        run: python tools/fetch_news.py --out data/news.json

      - name: Report broken sources
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/health_issue.py || echo "::warning::Couldn't update the source-health issue"

      - name: Save news to the repo
        run: |
          if ! git diff --quiet -- data/; then
            git config user.name "whimsy-wire[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json data/hotfixes.json data/health.json
            git commit -m "Refresh The Wire"
            git push || echo "::warning::Couldn't save news to the repo; the site still deploys with it"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
